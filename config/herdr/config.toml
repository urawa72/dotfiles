# 初回起動時のセットアップ画面を表示しない
onboarding = false

[terminal]
# macOS ではログインシェルとして起動し、PATH などを読み込む
shell_mode = "auto"
# 新しいタブやペインは現在の作業ディレクトリを引き継ぐ
new_cwd = "follow"

[keys]
# キーバインドのプレフィックスキー（Ctrl+B は使わず Ctrl+S）
prefix = "ctrl+s"
# workspaceを作成／名前変更／終了
new_workspace = "prefix+shift+n"
rename_workspace = "prefix+shift+w"
close_workspace = "prefix+shift+d"
# 前後のworkspaceへ移動
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"
# workspace picker（既定のprefix+w）
workspace_picker = "prefix+w"
# 新しいタブを作成
new_tab = "prefix+c"
# 次のタブへ移動
next_tab = "prefix+l"
# 前のタブへ移動
previous_tab = "prefix+h"
# 次／前のペインへ順番に移動
cycle_pane_next = "prefix+j"
cycle_pane_previous = "prefix+k"
# 方向指定の移動は使わない
focus_pane_up = ""
focus_pane_down = ""
# 左右にペインを分割
split_vertical = "prefix+v"
# 上下にペインを分割（既定のprefix+-）
split_horizontal = "prefix+minus"
# ペインを閉じる操作は割り当てない
close_pane = ""
# prefix+qは既定のdetachに戻す
detach = "prefix+q"
# 設定を再読み込み
reload_config = "prefix+r"
# 直前にフォーカスしていたペインへ戻る
last_pane = "prefix+ctrl+t"
# ペインのサイズ変更モードに入る
resize_mode = "prefix+shift+r"

[ui]
# マウス操作を有効にする
mouse_capture = true
# マウスで選択したテキストを自動コピー
copy_on_select = true
# ペインの境界線を表示（true は auto と同じ）
pane_borders = true
# 分割ペインの間に余白を表示
pane_gaps = true
# タブが1つだけでもタブバーを表示
hide_tab_bar_when_single_tab = false

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"
